appId: com.alphazonelabs.brandsparq.e2e
name: BrandSparQ isolated fixture workspace acceptance
---
- launchApp:
    clearState: true
- assertVisible: "Continue with Google"
- openLink: "brandsparq-e2e://login?handoff=fixture-handoff"
- extendedWaitUntil:
    visible: "Your workspace"
    timeout: 30000
- openLink: "brandsparq-e2e://review"
- assertVisible: "Launch campaign"
# Private review exposes both artwork and editable copy on native screens.
- openLink: "brandsparq-e2e://posts/fixture-post"
- extendedWaitUntil:
    visible: "Post image"
    timeout: 15000
- scrollUntilVisible:
    element: "Caption"
    direction: DOWN
- tapOn: "Caption"
- eraseText: 200
- inputText: "Native acceptance caption"
- hideKeyboard
- scrollUntilVisible:
    element: "Save copy"
    direction: DOWN
- tapOn: "Save copy"
- extendedWaitUntil:
    visible: "Save copy"
    timeout: 15000
- extendedWaitUntil:
    visible: "Native acceptance caption"
    timeout: 15000
# The custom picker is usable without committing a scheduling mutation.
- openLink: "brandsparq-e2e://posts/fixture-post/reschedule"
- scrollUntilVisible:
    element: "Time:.*"
    direction: DOWN
- tapOn: "Time:.*"
- scrollUntilVisible:
    element: "Hour 00"
    direction: UP
- scrollUntilVisible:
    element: "Hour 12"
    direction: DOWN
- tapOn: "Hour 12"
- scrollUntilVisible:
    element: "Minute 00"
    direction: UP
- tapOn: "Minute 00"
- tapOn: "Use time"
- assertVisible: "Time: 12:00"
- openLink: "brandsparq-e2e://clients"
- assertVisible: "Your clients"
- scrollUntilVisible:
    element: "Client A"
    direction: DOWN
- assertVisible: "Client A"
- scrollUntilVisible:
    element: "Client B"
    direction: DOWN
- assertVisible: "Client B"
- openLink: "brandsparq-e2e://create"
- tapOn: "Create a social post"
- scrollUntilVisible:
    element: "2. Social post goal"
    direction: DOWN
- assertVisible: "2. Social post goal"
- scrollUntilVisible:
    element: "Create a campaign"
    direction: UP
- tapOn: "Create a campaign"
- scrollUntilVisible:
    element: "2. Campaign objective"
    direction: DOWN
- assertVisible: "2. Campaign objective"
- openLink: "brandsparq-e2e://settings"
- assertVisible: "Settings"
- openLink: "brandsparq-e2e://notifications"
- assertVisible: "Notifications"
- openLink: "brandsparq-e2e://paused"
- assertVisible: "Paused content"
- openLink: "brandsparq-e2e://profile"
- assertVisible: "Save profile"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- assertVisible: "Continue with Google"
- launchApp
- assertVisible: "Continue with Google"
