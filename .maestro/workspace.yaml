appId: com.alphazonelabs.brandsparq
name: BrandSparQ native workspace acceptance
---
- launchApp:
    clearState: true
- assertVisible: "Continue with Google"
- openLink: "brandsparq://login?handoff=fixture-handoff"
- extendedWaitUntil:
    visible: "Marketing moves faster with a system."
    timeout: 30000
- tapOn: "Review"
- assertVisible: "Launch campaign"
- tapOn: "More"
- tapOn: "Clients & Brand Brain"
- assertVisible: "Client A"
- assertVisible: "Client B"
- openLink: "brandsparq://more"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- assertVisible: "Continue with Google"
