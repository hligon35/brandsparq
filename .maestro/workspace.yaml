appId: com.alphazonelabs.brandsparq.e2e
name: BrandSparQ isolated fixture workspace acceptance
---
- launchApp:
    clearState: true
- assertVisible: "Continue with Google"
- openLink: "brandsparq-e2e://login?handoff=fixture-handoff"
- extendedWaitUntil:
    visible: "Your workspace"
    timeout: 30000
- openLink: "brandsparq-e2e://review"
- assertVisible: "Launch campaign"
- openLink: "brandsparq-e2e://clients"
- assertVisible: "Your clients"
- scrollUntilVisible:
    element: "Client A"
    direction: DOWN
- assertVisible: "Client A"
- scrollUntilVisible:
    element: "Client B"
    direction: DOWN
- assertVisible: "Client B"
- openLink: "brandsparq-e2e://create"
- tapOn: "Create a social post"
- scrollUntilVisible:
    element: "2. Social post goal"
    direction: DOWN
- assertVisible: "2. Social post goal"
- scrollUntilVisible:
    element: "Create a campaign"
    direction: UP
- tapOn: "Create a campaign"
- scrollUntilVisible:
    element: "2. Campaign objective"
    direction: DOWN
- assertVisible: "2. Campaign objective"
- openLink: "brandsparq-e2e://settings"
- assertVisible: "Settings"
- openLink: "brandsparq-e2e://notifications"
- assertVisible: "Notifications"
- openLink: "brandsparq-e2e://paused"
- assertVisible: "Paused content"
- openLink: "brandsparq-e2e://profile"
- assertVisible: "Save profile"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- assertVisible: "Continue with Google"
- launchApp
- assertVisible: "Continue with Google"
