name: BrandSparQ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brandsparq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci && npm ci --prefix cloudflare
      - name: Install browser runners
        run: npx playwright install --with-deps chromium webkit
      - name: Run complete quality gate
        run: npm run validate
      - name: Upload browser traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brandsparq-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
