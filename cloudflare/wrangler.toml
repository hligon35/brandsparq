name = "brandsparq"
main = "src/index.ts"
compatibility_date = "2026-10-02"

routes = [
  { pattern = "brandsparq.getsparqd.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
GOOGLE_CLIENT_ID = "1096231725383-7lrjdhj0p4gp8ipbi6228tf03dhg5jqe.apps.googleusercontent.com"
# GOOGLE_CLIENT_SECRET is set via `wrangler secret put GOOGLE_CLIENT_SECRET`, not committed here
GOOGLE_REDIRECT_URI = "https://brandsparq.getsparqd.com/v1/auth/google/callback"
LINKEDIN_REDIRECT_URI = "https://brandsparq.getsparqd.com/v1/social/linkedin/callback"
META_REDIRECT_URI = "https://brandsparq.getsparqd.com/v1/social/meta/callback"
OPENAI_FAST_MODEL = "gpt-6-luna"
OPENAI_IMAGE_EDIT_MODEL = "gpt-image-2.5-sunburst"
OPENAI_IMAGE_MODEL = "gpt-image-2.5-flare"
OPENAI_IMAGE_QUALITY = "medium"
OPENAI_IMAGE_SIZE = "1024x1280"
OPENAI_TEXT_MODEL = "gpt-6.1-sol"
PUBLIC_BASE_URL = "https://brandsparq.getsparqd.com"
REVIEW_BASE_URL = "https://brandsparq.getsparqd.com"
TIKTOK_REDIRECT_URI = "https://brandsparq.getsparqd.com/v1/social/tiktok/callback"
X_REDIRECT_URI = "https://brandsparq.getsparqd.com/v1/social/x/callback"
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/v1/*", "/health" ]

[[d1_databases]]
binding = "DB"
database_name = "brandsparq"
database_id = "1f6f0d67-1725-4f19-8fd9-0f80f600f5b1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "brandsparq-media"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "brandsparq-publish"

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "brandsparq-generation"

[[queues.consumers]]
queue = "brandsparq-publish"
max_batch_size = 10
max_retries = 3
max_concurrency = 5
dead_letter_queue = "brandsparq-publish-dlq"

[[queues.consumers]]
queue = "brandsparq-generation"
max_batch_size = 2
max_retries = 2
max_concurrency = 2
dead_letter_queue = "brandsparq-generation-dlq"

[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true