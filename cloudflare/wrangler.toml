name = "brandsparq"
main = "src/index.ts"
compatibility_date = "2026-10-02"

[vars]
ENVIRONMENT = "production"
OPENAI_TEXT_MODEL = "gpt-5.6-sol"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/v1/*", "/health" ]

[[d1_databases]]
binding = "DB"
database_name = "brandsparq"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "brandsparq-media"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "brandsparq-publish"

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "brandsparq-generation"

[[queues.consumers]]
queue = "brandsparq-publish"
max_batch_size = 10
max_retries = 3

[[queues.consumers]]
queue = "brandsparq-generation"
max_batch_size = 2
max_retries = 2

[triggers]
crons = ["* * * * *"]
